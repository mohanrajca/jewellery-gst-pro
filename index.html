function numWords(num){
  if(!num||num===0)return"Zero Rupees Only";
  const a=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
  const b=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  const cv=(n)=>{if(n<20)return a[n];if(n<100)return b[Math.floor(n/10)]+(n%10?" "+a[n%10]:"");if(n<1000)return a[Math.floor(n/100)]+" Hundred"+(n%100?" and "+cv(n%100):"");if(n<100000)return cv(Math.floor(n/1000))+" Thousand"+(n%1000?" "+cv(n%1000):"");if(n<10000000)return cv(Math.floor(n/100000))+" Lakh"+(n%100000?" "+cv(n%100000):"");return cv(Math.floor(n/10000000))+" Crore"+(n%10000000?" "+cv(n%10000000):"");};
  const r=Math.floor(num);const p=Math.round((num-r)*100);
  let s="Rupees "+cv(r);if(p>0)s+=" and "+cv(p)+" Paise";return s+" Only";
}

function Toast({msg,type="info",onClose}){
  const bg=type==="success"?"#27ae60":type==="error"?"#c0392b":type==="warning"?"#d4a017":"#2c3e50";
  useEffect(()=>{const t=setTimeout(onClose,3500);return()=>clearTimeout(t);},[]);
  return <div style={{position:'fixed',top:18,right:18,zIndex:9999,background:bg,color:'#fff',padding:'11px 18px',borderRadius:10,boxShadow:'0 6px 28px rgba(0,0,0,.2)',maxWidth:380,fontSize:13.5,display:'flex',alignItems:'center',gap:8,animation:'slideIn .25s ease'}}>
    <span style={{flex:1}}>{msg}</span><span onClick={onClose} style={{cursor:'pointer',opacity:.7,fontSize:16}}>×</span>
  </div>;
}

// ═══════════════════════════════════════
// MAIN APPLICATION
// ═══════════════════════════════════════
function App(){
  const [url,setUrl]=useState(()=>LS.get('url',''));
  const [sid,setSid]=useState(()=>LS.get('sid',''));
  const [conn,setConn]=useState(false);
  const [syncing,setSyncing]=useState(false);
  const [lastSync,setLastSync]=useState(null);

  const [customers,setCust]=useState(()=>LS.get('customers',[]));
  const [products,setProd]=useState(()=>LS.get('products',[]));
  const [invoices,setInv]=useState(()=>LS.get('invoices',[]));
  const [dcs,setDcs]=useState(()=>LS.get('dcs',[]));
  const [lineOfSales,setLos]=useState(()=>LS.get('lineOfSales',[]));
  const [expenses,setExp]=useState(()=>LS.get('expenses',[]));
  const [receipts,setRec]=useState(()=>LS.get('receipts',[]));
  const [payments,setPay]=useState(()=>LS.get('payments',[]));
  const [company,setCo]=useState(()=>LS.get('company',{state:'Tamil Nadu',stateCode:'33'}));
  const [logo,setLogo]=useState(()=>LS.get('logo',''));
  const [settings,setSettings]=useState(()=>LS.get('settings',{dcLimit:3,losLimit:1,defaultPurity:'916',defaultGst:3}));

  const [page,setPage]=useState('dashboard');
  const [sideOpen,setSideOpen]=useState(window.innerWidth>768);
  const [toast,setToast]=useState(null);
  const [search,setSearch]=useState('');

  // Modals
  const [mCust,setMCust]=useState(null);
  const [mProd,setMProd]=useState(null);
  const [mInv,setMInv]=useState(null);
  const [mDc,setMDc]=useState(null);
  const [mLos,setMLos]=useState(null);
  const [mExp,setMExp]=useState(null);
  const [mRec,setMRec]=useState(null);
  const [mPay,setMPay]=useState(null);
  const [mView,setMView]=useState(null);
  const [delConfirm,setDelConfirm]=useState(null);

  const notify=(msg,type="info")=>setToast({msg,type});

  // Auto-save to localStorage
  useEffect(()=>{LS.set('customers',customers)},[customers]);
  useEffect(()=>{LS.set('products',products)},[products]);
  useEffect(()=>{LS.set('invoices',invoices)},[invoices]);
  useEffect(()=>{LS.set('dcs',dcs)},[dcs]);
  useEffect(()=>{LS.set('lineOfSales',lineOfSales)},[lineOfSales]);
  useEffect(()=>{LS.set('expenses',expenses)},[expenses]);
  useEffect(()=>{LS.set('receipts',receipts)},[receipts]);
  useEffect(()=>{LS.set('payments',payments)},[payments]);

  // ═══ API + SYNC ENGINE ═══
  const api=async(action,data={})=>{if(!url||!sid)return null;try{return await apiCall(url,sid,action,data)}catch(e){console.warn('API:',e);return null}};

  // Connect to Google Sheet
  const connect=async()=>{
    if(!url||!sid){notify("Enter both Web App URL and Sheet ID","warning");return;}
    setSyncing(true);
    try{
      const r=await apiCall(url,sid,'setupSheets',{});
      if(r.success){LS.set('url',url);LS.set('sid',sid);setConn(true);notify("Connected! Syncing data...","success");await fullSync();}
      else notify(r.error||"Connection failed","error");
    }catch(e){notify("Connection error: "+e.message,"error");}
    setSyncing(false);
  };

  // Full sync — pull all data from Google Sheet
  const fullSync=async()=>{
    if(!url||!sid)return;setSyncing(true);
    try{
      const r=await apiCall(url,sid,'getAll',{});
      if(r.success&&r.data){
        const d=r.data;
        if(d.customers)setCust(d.customers.map(c=>({id:c.id,name:c.name||'',type:c.type||'Retailer',gstin:c.gstin||'',address:c.address||'',city:c.city||'',state:c.state||'',stateCode:c.statecode||c.stateCode||'',phone:c.phone||'',email:c.email||'',createdAt:c.createdat||''})));
        if(d.products)setProd(d.products.map(p=>({id:p.id,name:p.name||'',hsn:p.hsn||'7113',defaultPurity:p.defaultpurity||p.defaultPurity||'916',makingType:p.makingtype||p.makingType||'per_gm',makingCharge:+(p.makingcharge||p.makingCharge||0),defaultGst:+(p.defaultgst||p.defaultGst||3),description:p.description||'',createdAt:p.createdat||''})));
        if(d.invoices)setInv(d.invoices.map(v=>{let items=[];try{items=typeof v.itemsjson==='string'?JSON.parse(v.itemsjson):(v.items||[])}catch{}return{id:v.id,invoiceNumber:v.invoicenumber||'',invoiceDate:v.invoicedate||'',dueDate:v.duedate||'',invoiceType:v.invoicetype||'B2B',customerName:v.customername||'',customerGstin:v.customergstin||'',customerAddress:v.customeraddress||'',customerState:v.customerstate||'',customerStateCode:v.customerstatecode||'',customerPhone:v.customerphone||'',taxableAmount:+(v.taxableamount||0),cgstAmount:+(v.cgstamount||0),sgstAmount:+(v.sgstamount||0),igstAmount:+(v.igstamount||0),grandTotal:+(v.grandtotal||0),items,notes:v.notes||'',losRef:v.losref||'',createdBy:v.createdby||'',createdAt:v.createdat||''};}));
        if(d.dcs)setDcs(d.dcs.map(dc=>{let items=[];try{items=typeof dc.itemsjson==='string'?JSON.parse(dc.itemsjson):(dc.items||[])}catch{}return{id:dc.id,dcNumber:dc.dcnumber||'',date:dc.date||'',dueDate:dc.duedate||'',jobworkerName:dc.jobworkername||'',jobworkerAddress:dc.jobworkeraddress||'',purpose:dc.purpose||'',status:dc.status||'Sent',totalWeight:+(dc.totalweight||0),items,notes:dc.notes||'',createdAt:dc.createdat||''};}));
        if(d.lineofsales||d.lineOfSales){const los=d.lineofsales||d.lineOfSales;setLos(los.map(l=>{let items=[];try{items=typeof l.itemsjson==='string'?JSON.parse(l.itemsjson):(l.items||[])}catch{}return{id:l.id,losNumber:l.losnumber||'',date:l.date||'',retailerName:l.retailername||'',retailerGstin:l.retailergstin||'',retailerAddress:l.retaileraddress||'',retailerState:l.retailerstate||'',retailerStateCode:l.retailerstatecode||'',retailerPhone:l.retailerphone||'',city:l.city||'',status:l.status||'On Approval',totalWeight:+(l.totalweight||0),totalValue:+(l.totalvalue||0),items,notes:l.notes||'',createdAt:l.createdat||''};}));}
        if(d.expenses)setExp(d.expenses.map(e=>({id:e.id,voucherNo:e.voucherno||'',date:e.date||'',category:e.category||'',vendor:e.vendor||'',amount:+(e.amount||0),gstRate:+(e.gstrate||0),gstAmount:+(e.gstamount||0),total:+(e.total||0),paymentMethod:e.paymentmethod||'Cash',description:e.description||'',createdBy:e.createdby||''})));
        if(d.receipts)setRec(d.receipts.map(r=>({id:r.id,receiptNo:r.receiptno||'',date:r.date||'',receivedFrom:r.receivedfrom||'',amount:+(r.amount||0),mode:r.mode||'Cash',towards:r.towards||'',description:r.description||'',createdBy:r.createdby||''})));
        if(d.payments)setPay(d.payments.map(p=>({id:p.id,paymentNo:p.paymentno||'',date:p.date||'',paidTo:p.paidto||'',amount:+(p.amount||0),mode:p.mode||'Cash',towards:p.towards||'',description:p.description||'',createdBy:p.createdby||''})));
        setConn(true);setLastSync(new Date().toLocaleTimeString());
        notify("✓ All data synced from Google Sheet","success");
      }
    }catch(e){notify("Sync error: "+e.message,"error");}
    setSyncing(false);
  };

  // Backup — push all to sheet
  const backup=async()=>{setSyncing(true);await api('backup',{customers,products,invoices,dcs,lineOfSales,expenses,receipts,payments});notify("Full backup pushed","success");setSyncing(false);};

  // Auto-connect on load
  useEffect(()=>{if(url&&sid&&!conn){connect();}},[]);

  // ═══ CRUD + SYNC ═══
  const saveCust=async(c)=>{
    const isNew=!c.id||!customers.find(x=>x.id===c.id);
    const d={...c,id:c.id||gid('C'),createdAt:c.createdAt||new Date().toISOString()};
    if(isNew)setCust(p=>[...p,d]);else setCust(p=>p.map(x=>x.id===d.id?d:x));
    api('syncCustomer',d);notify("Customer saved"+(conn?" → Sheet synced":""),"success");setMCust(null);return d;
  };

  const saveProd=async(p)=>{
    const isNew=!p.id||!products.find(x=>x.id===p.id);
    const d={...p,id:p.id||gid('P'),createdAt:p.createdAt||new Date().toISOString()};
    if(isNew)setProd(prev=>[...prev,d]);else setProd(prev=>prev.map(x=>x.id===d.id?d:x));
    api('syncProduct',d);notify("Product saved"+(conn?" → Sheet synced":""),"success");setMProd(null);return d;
  };
  
  const saveInvoice=async(inv)=>{
    const d={...inv,id:inv.id||gid('INV'),invoiceNumber:inv.invoiceNumber||'INV-'+String(invoices.length+1).padStart(4,'0')};
    let taxT=0,gstT=0;
    (d.items||[]).forEach(it=>{
      const metalVal=(it.netWt||0)*(it.ratePerGm||0);
      const makingVal=it.makingType==='per_gm'?(it.makingCharge||0)*(it.netWt||0):it.makingType==='per_pc'?(it.makingCharge||0)*(it.pcs||1):(it.makingCharge||0);
      const taxable=metalVal+makingVal+(it.stoneCharges||0);
      const gst=taxable*(it.gstRate||3)/100;
      taxT+=taxable;gstT+=gst;
    });
    const isIGST=d.customerStateCode&&company.stateCode&&String(d.customerStateCode).trim()!==String(company.stateCode).trim();
    d.taxableAmount=Math.round(taxT*100)/100;
    d.cgstAmount=isIGST?0:Math.round(gstT/2*100)/100;
    d.sgstAmount=isIGST?0:Math.round(gstT/2*100)/100;
    d.igstAmount=isIGST?Math.round(gstT*100)/100:0;
    d.grandTotal=Math.round((taxT+gstT)*100)/100;
    d.isIGST=isIGST;
    d.placeOfSupply=d.customerState+' ('+d.customerStateCode+')';
    d.supplyState=company.state+' ('+company.stateCode+')';
    d.createdAt=d.createdAt||new Date().toISOString();
    
    const isNew=!inv.id||!invoices.find(x=>x.id===inv.id);
    if(isNew)setInv(p=>[...p,d]);else setInv(p=>p.map(x=>x.id===d.id?d:x));
    api('syncInvoice',d);notify("Invoice saved"+(conn?" → Sheet synced":""),"success");setMInv(null);return d;
  };

  const saveDC=async(dc)=>{
    const d={...dc,id:dc.id||gid('DC'),dcNumber:dc.dcNumber||'DC-'+String(dcs.length+1).padStart(4,'0'),dueDate:dc.dueDate||addDays(dc.date||td(),settings.dcLimit),createdAt:dc.createdAt||new Date().toISOString()};
    const isNew=!dc.id||!dcs.find(x=>x.id===dc.id);
    if(isNew)setDcs(p=>[...p,d]);else setDcs(p=>p.map(x=>x.id===d.id?d:x));
    api('syncDC',d);notify("DC saved"+(conn?" → Sheet synced":""),"success");setMDc(null);return d;
  };

  const saveLOS=async(los)=>{
    const d={...los,id:los.id||gid('LOS'),losNumber:los.losNumber||'LOS-'+String(lineOfSales.length+1).padStart(4,'0'),createdAt:los.createdAt||new Date().toISOString()};
    const isNew=!los.id||!lineOfSales.find(x=>x.id===los.id);
    if(isNew)setLos(p=>[...p,d]);else setLos(p=>p.map(x=>x.id===d.id?d:x));
    api('syncLOS',d);notify("Line of Sale saved"+(conn?" → Sheet synced":""),"success");setMLos(null);return d;
  };

  const saveExpense=async(e)=>{
    const d={...e,id:e.id||gid('EXP'),createdAt:e.createdAt||new Date().toISOString()};
    const isNew=!e.id||!expenses.find(x=>x.id===e.id);
    if(isNew)setExp(p=>[...p,d]);else setExp(p=>p.map(x=>x.id===d.id?d:x));
    api('syncExpense',d);notify("Expense saved"+(conn?" → Sheet synced":""),"success");setMExp(null);return d;
  };

  const saveReceipt=async(r)=>{
    const d={...r,id:r.id||gid('REC'),receiptNo:r.receiptNo||'REC-'+String(receipts.length+1).padStart(4,'0'),createdAt:r.createdAt||new Date().toISOString()};
    const isNew=!r.id||!receipts.find(x=>x.id===r.id);
    if(isNew)setRec(p=>[...p,d]);else setRec(p=>p.map(x=>x.id===d.id?d:x));
    api('syncReceipt',d);notify("Receipt saved"+(conn?" → Sheet synced":""),"success");setMRec(null);return d;
  };

  const savePayment=async(p)=>{
    const d={...p,id:p.id||gid('PAY'),paymentNo:p.paymentNo||'PAY-'+String(payments.length+1).padStart(4,'0'),createdAt:p.createdAt||new Date().toISOString()};
    const isNew=!p.id||!payments.find(x=>x.id===p.id);
    if(isNew)setPay(prev=>[...prev,d]);else setPay(prev=>prev.map(x=>x.id===d.id?d:x));
    api('syncPayment',d);notify("Payment saved"+(conn?" → Sheet synced":""),"success");setMPay(null);return d;
  };

  const doDelete=(type)=>{
    if(!delConfirm)return;
    const id=delConfirm.id;
    const delMap={customer:['syncCustomer','deleteCustomer',customers,setCust],product:['syncProduct','deleteProduct',products,setProd],invoice:['syncInvoice','deleteInvoice',invoices,setInv],dc:['syncDC','deleteDC',dcs,setDcs],los:['syncLOS','deleteLOS',lineOfSales,setLos],expense:['syncExpense','deleteExpense',expenses,setExp],receipt:['syncReceipt','deleteReceipt',receipts,setRec],payment:['syncPayment','deletePayment',payments,setPay]};
    const[_,apiAction,_a,setFn]=delMap[type]||[];
    if(setFn)setFn(p=>p.filter(x=>x.id!==id));
    if(apiAction)api(apiAction,{id});
    notify("Deleted"+(conn?" → Sheet synced":""),"success");setDelConfirm(null);
  };

  // Convert LOS to Invoice
  const convertLosToInv=(los)=>{
    setMInv({
      customerName:los.retailerName,customerGstin:los.retailerGstin||'',
      customerAddress:los.retailerAddress||'',customerState:los.retailerState||'',
      customerStateCode:los.retailerStateCode||'',customerPhone:los.retailerPhone||'',
      invoiceDate:td(),items:(los.items||[]).map(it=>({...it,gstRate:it.gstRate||3})),
      notes:'Converted from Line of Sale: '+los.losNumber,losRef:los.id
    });
    // Mark LOS as converted
    setLos(p=>p.map(x=>x.id===los.id?{...x,status:'Sold'}:x));
    setPage('invoices');
  };

  const overdueDCs=dcs.filter(d=>d.status!=='Received Back'&&daysDiff(d.date)>settings.dcLimit);
  const unsettledLOS=lineOfSales.filter(l=>l.status==='On Approval'&&daysDiff(l.date)>settings.losLimit);
  const todayLOS=lineOfSales.filter(l=>l.status==='On Approval'&&l.date===td());
  const revenue=invoices.reduce((s,i)=>s+(+i.grandTotal||0),0);
  const totalReceipts=receipts.reduce((s,r)=>s+(+r.amount||0),0);
  const totalPayments=payments.reduce((s,p)=>s+(+p.amount||0),0);
  const totalExpenses=expenses.reduce((s,e)=>s+(+e.total||+e.amount||0),0);

  // ═══════════════════════════════════════
  // NAVIGATION
  // ═══════════════════════════════════════
  const nav=[
    {id:'dashboard',label:'Dashboard',icon:'home'},
    {id:'customers',label:'Customers',icon:'users'},
    {id:'products',label:'Products',icon:'box'},
    {id:'invoices',label:'Tax Invoice',icon:'file'},
    {id:'dc',label:'Delivery Challan',icon:'truck',badge:overdueDCs.length||null},
    {id:'los',label:'Line of Sale',icon:'tag',badge:unsettledLOS.length||null},
    {id:'receipts',label:'Receipts',icon:'wallet'},
    {id:'payments',label:'Payments',icon:'dollar'},
    {id:'expenses',label:'Expenses',icon:'down'},
    {id:'salesreg',label:'Sales Register',icon:'list'},
    {id:'settings',label:'Settings',icon:'gear'},
  ];

  // ═══════════════════════════════════════
  // RENDER
  // ═══════════════════════════════════════
  return <div style={{display:'flex',minHeight:'100vh'}}>
    {toast&&<Toast {...toast} onClose={()=>setToast(null)}/>}
    <Confirm open={!!delConfirm} onClose={()=>setDelConfirm(null)} onOk={()=>doDelete(delConfirm?.type)} title="Delete?" msg={`Delete ${delConfirm?.label||'this item'}? This cannot be undone.`}/>

    {/* MOBILE TOP BAR */}
    <div className="top-bar no-print">
      <button onClick={()=>setSideOpen(!sideOpen)} style={{background:'none',border:'none',color:'#e8d5a3',cursor:'pointer',padding:4}}><Ic name="menu" size={22}/></button>
      <span className="top-bar-title">💎 Jewellery GST Pro</span>
      {conn&&<div style={{width:8,height:8,borderRadius:'50%',background:'#27ae60'}}/>}
      <button onClick={()=>window.open('https://ewaybillgst.gov.in','_blank')} style={{background:'none',border:'none',color:'#c4b89a',cursor:'pointer',padding:4}}><Ic name="globe" size={18}/></button>
    </div>

    {/* SIDEBAR OVERLAY (mobile) */}
    <div className={`sidebar-overlay${sideOpen&&window.innerWidth<=768?' show':''}`} onClick={()=>setSideOpen(false)}/>

    {/* SIDEBAR */}
    <div className={`sidebar no-print${sideOpen?' open':''}`} style={{width:sideOpen?220:56,background:'linear-gradient(180deg,#3a2e1a 0%,#2a2010 100%)',transition:'width .2s',flexShrink:0,display:'flex',flexDirection:'column',overflow:'hidden'}}>
      <div style={{padding:sideOpen?'12px 14px':'12px 10px',display:'flex',alignItems:'center',gap:8,borderBottom:'1px solid rgba(255,255,255,.06)'}}>
        <button onClick={()=>setSideOpen(!sideOpen)} style={{background:'none',border:'none',color:'#c4b89a',cursor:'pointer',padding:3}}><Ic name="menu" size={20}/></button>
        {sideOpen&&<span style={{fontWeight:700,fontSize:13.5,color:'#e8d5a3',whiteSpace:'nowrap'}}>💎 Jewellery GST Pro</span>}
      </div>
      <nav style={{flex:1,padding:'8px 6px',overflow:'auto',WebkitOverflowScrolling:'touch'}}>
        {nav.map(n=><button key={n.id} onClick={()=>{setPage(n.id);setSearch('');if(window.innerWidth<=768)setSideOpen(false);}} style={{
          width:'100%',display:'flex',alignItems:'center',gap:8,padding:sideOpen?'9px 12px':'9px',
          borderRadius:7,border:'none',cursor:'pointer',marginBottom:2,minHeight:38,
          background:page===n.id?'rgba(228,213,163,.15)':'transparent',
          color:page===n.id?'#e8d5a3':'rgba(196,184,154,.55)',fontWeight:page===n.id?700:500,fontSize:13,
          justifyContent:sideOpen?'flex-start':'center',whiteSpace:'nowrap',position:'relative'
        }}>
          <Ic name={n.icon} size={16}/>{sideOpen&&n.label}
          {n.badge&&<span style={{position:sideOpen?'static':'absolute',top:2,right:2,background:'#c0392b',color:'#fff',fontSize:10,fontWeight:700,padding:'1px 5px',borderRadius:8,marginLeft:sideOpen?'auto':0}}>{n.badge}</span>}
        </button>)}
      </nav>
      <div style={{padding:'8px '+(sideOpen?'14':'6')+'px',borderTop:'1px solid rgba(255,255,255,.06)'}}>
        {sideOpen&&<div style={{fontSize:10.5,color:'rgba(196,184,154,.45)',display:'flex',alignItems:'center',gap:5,marginBottom:4}}>
          <div style={{width:7,height:7,borderRadius:'50%',background:conn?'#27ae60':'#e74c3c'}}/>
          {conn?'Sheet Synced':'Offline (Local)'}
          {syncing&&<span style={{marginLeft:4}}>⟳</span>}
          {lastSync&&<span style={{marginLeft:'auto',fontSize:9}}>{lastSync}</span>}
        </div>}
        {sideOpen&&<div style={{fontSize:10,color:'rgba(196,184,154,.3)'}}>v1.0 — Gold & Silver Mfg</div>}
      </div>
    </div>

    {/* MAIN CONTENT */}
    <div className="main-content" style={{flex:1,padding:'16px 20px',maxHeight:'100vh',overflow:'auto',WebkitOverflowScrolling:'touch'}}>

      {/* ═══ DASHBOARD ═══ */}
      {page==='dashboard'&&<div>
        <h2 style={{fontSize:20,fontWeight:800,margin:'0 0 16px',color:'#3a2e1a'}}>Dashboard</h2>
        
        {/* Alerts */}
        {(overdueDCs.length>0||unsettledLOS.length>0)&&<div style={{marginBottom:16}}>

function DataPage({title,data,cols,search,setSearch,onAdd,onEdit,onDel,onView,addLabel="Add",reverse,extraAction,extraInfo}){
  const filtered=data.filter(d=>!search||Object.values(d).some(v=>String(v).toLowerCase().includes(search.toLowerCase())));
  const rows=reverse?[...filtered].reverse():filtered;
  return <div>
    <div className="page-header" style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14,flexWrap:'wrap',gap:10}}>
      <h2 style={{fontSize:20,fontWeight:800,margin:0,color:'#3a2e1a'}}>{title} <span style={{fontSize:13,fontWeight:400,color:'#a09880'}}>({data.length})</span></h2>
      <div className="header-actions" style={{display:'flex',gap:6,flexWrap:'wrap'}}>
        <div style={{position:'relative',flex:'1 1 140px'}}>
          <div style={{position:'absolute',left:10,top:10,color:'#a09880'}}><Ic name="search" size={15}/></div>
          <input style={{...S.inp,paddingLeft:32,width:'100%',fontSize:13}} placeholder="Search..." value={search} onChange={e=>setSearch(e.target.value)}/>
        </div>
        <button style={{...S.btnP,whiteSpace:'nowrap'}} onClick={onAdd}><Ic name="plus" size={15}/> {addLabel}</button>
      </div>
    </div>
    {extraInfo}
    <div className="table-wrap" style={{...S.card,overflowX:'auto',WebkitOverflowScrolling:'touch'}}>
      <table style={{width:'100%',borderCollapse:'collapse',minWidth:600}}>
        <thead><tr>{cols.map(c=><th key={c.k} style={S.th}>{c.l}</th>)}<th style={S.th}>Actions</th></tr></thead>
        <tbody>
          {rows.map(d=><tr key={d.id} className="row-hover">
            {cols.map(c=><td key={c.k} style={{...S.td,fontWeight:c.bold?600:400}}>
              {c.code?<code style={{background:'#f5f0e8',padding:'1px 5px',borderRadius:3,fontSize:12}}>{d[c.k]||'—'}</code>:
              (c.fmt?c.fmt(d[c.k]):(d[c.k]||'—'))}
            </td>)}
            <td style={S.td}>
              <div style={{display:'flex',gap:3,flexWrap:'wrap'}}>
                {onView&&<button style={{...S.btnS,...S.btnSm}} onClick={()=>onView(d)} title="View/Print"><Ic name="eye" size={13}/></button>}
                <button style={{...S.btnS,...S.btnSm}} onClick={()=>onEdit(d)} title="Edit"><Ic name="edit" size={13}/></button>
                <button style={{...S.btnD,...S.btnSm}} onClick={()=>onDel(d.id)} title="Delete"><Ic name="trash" size={13}/></button>
                {extraAction&&extraAction(d)&&extraAction(d).map((a,i)=><button key={i} style={{...a.style,...S.btnSm}} onClick={a.onClick}>{a.label}</button>)}
              </div>
            </td>
          </tr>)}
          {!rows.length&&<tr><td colSpan={cols.length+1} style={{...S.td,textAlign:'center',color:'#a09880',padding:36}}>No records found</td></tr>}
        </tbody>
      </table>
    </div>
  </div>;
}

// JEWELLERY INVOICE FORM
// ═══════════════════════════════════════
function InvForm({data,onSave,onClose,customers,products,company,notify,settings,count}){
  const defItem={productName:'',hsn:'7113',pcs:1,grossWt:0,netWt:0,purity:settings.defaultPurity||'916',ratePerGm:0,makingType:'per_gm',makingCharge:0,stoneCharges:0,gstRate:settings.defaultGst||3};
  const[f,set]=useState({invoiceNumber:'',invoiceDate:td(),dueDate:'',invoiceType:'B2B',customerName:'',customerGstin:'',customerAddress:'',customerState:'',customerStateCode:'',customerPhone:'',items:[{...defItem}],notes:'',...data});

  const addItem=()=>set(p=>({...p,items:[...p.items,{...defItem}]}));
  const updItem=(i,k,v)=>set(p=>({...p,items:p.items.map((it,j)=>{
    if(j!==i)return it;
    const updated={...it,[k]:v};
    // Auto-fill from product master
    if(k==='productName'){
      const prod=products.find(x=>x.name===v);
      if(prod){updated.hsn=prod.hsn||'7113';updated.purity=prod.defaultPurity||settings.defaultPurity;updated.makingType=prod.makingType||'per_gm';updated.makingCharge=prod.makingCharge||0;updated.gstRate=prod.defaultGst||3;}
    }
    return updated;
  })}));
  const remItem=(i)=>set(p=>({...p,items:p.items.filter((_,j)=>j!==i)}));

  // Select customer
  const selectCust=(c)=>{
    set(p=>({...p,customerName:c.name,customerGstin:c.gstin||'',customerAddress:c.address||'',customerState:c.state||'',customerStateCode:c.stateCode||'',customerPhone:c.phone||'',invoiceType:c.gstin?'B2B':'B2CS'}));
  };

  // ═══ GSTIN → State Code auto-detect ═══
  const handleGstin=(val)=>{
    const g=val.toUpperCase().replace(/[^A-Z0-9]/g,'');
    const upd={customerGstin:g};
    if(g.length>=2){
      const code=g.substring(0,2);
      const st=STATES.find(s=>s.c===code);
      if(st){upd.customerState=st.n;upd.customerStateCode=st.c;upd.invoiceType=g.length>=15?'B2B':'B2CS';}
    }
    set(p=>({...p,...upd}));
  };

  // ═══ Place of Supply Logic ═══
  const posCompanyCode=String(company.stateCode||'').trim();
  const posCustCode=String(f.customerStateCode||'').trim();
  const posValid=posCompanyCode&&posCustCode&&posCompanyCode!=='undefined'&&posCustCode!=='undefined';
  const isIGST=posValid&&posCustCode!==posCompanyCode;
  const posLabel=!posValid?'⚠ Select customer state for GST type':isIGST?`↔ Inter-State Sale (${posCompanyCode} → ${posCustCode}) — IGST applies`:`✓ Intra-State Sale (${posCompanyCode}) — CGST + SGST applies`;
  const posBg=!posValid?'#fef9e7':isIGST?'#eff6ff':'#ecfdf5';
  const posColor=!posValid?'#856404':isIGST?'#1a56db':'#166534';

  // Totals
  const calcItem=(it)=>{
    const metalVal=(it.netWt||0)*(it.ratePerGm||0);
    const makingVal=it.makingType==='per_gm'?(it.makingCharge||0)*(it.netWt||0):it.makingType==='per_pc'?(it.makingCharge||0)*(it.pcs||1):(it.makingCharge||0);
    const taxable=metalVal+makingVal+(it.stoneCharges||0);
    const gstRate=it.gstRate||3;
    const gst=taxable*gstRate/100;
    const cgst=isIGST?0:gst/2;
    const sgst=isIGST?0:gst/2;
    const igst=isIGST?gst:0;
    return {metalVal,makingVal,taxable,gstRate,gst,cgst,sgst,igst,total:taxable+gst};
  };

  const totals=f.items.reduce((acc,it)=>{const c=calcItem(it);return{tax:acc.tax+c.taxable,gst:acc.gst+c.gst,cgst:acc.cgst+c.cgst,sgst:acc.sgst+c.sgst,igst:acc.igst+c.igst,wt:acc.wt+(it.netWt||0)};},{tax:0,gst:0,cgst:0,sgst:0,igst:0,wt:0});
  const grand=totals.tax+totals.gst;

  const doSave=()=>{
    if(!f.customerName){notify("Customer name required","warning");return;}
    if(!f.items.length||!f.items[0].productName){notify("At least one item required","warning");return;}
    if(!f.customerStateCode){notify("⚠ Customer State is required for Place of Supply / GST calculation","warning");return;}
    if(!company.stateCode){notify("⚠ Set your Company State in Settings first","warning");return;}
    onSave({...f,invoiceNumber:f.invoiceNumber||'INV-'+String(count+1).padStart(4,'0')});
  };

  return <div>
    {/* Header */}
    <div className="form-grid-3" style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10,marginBottom:16}}>
      <div><label style={S.lbl}>Invoice #</label><input style={{...S.inp,fontFamily:'monospace'}} value={f.invoiceNumber} placeholder={'INV-'+String(count+1).padStart(4,'0')} onChange={e=>set(p=>({...p,invoiceNumber:e.target.value}))}/></div>
      <div><label style={S.lbl}>Date</label><input style={S.inp} type="date" value={f.invoiceDate} onChange={e=>set(p=>({...p,invoiceDate:e.target.value}))}/></div>
      <div><label style={S.lbl}>Type</label><select style={S.inp} value={f.invoiceType} onChange={e=>set(p=>({...p,invoiceType:e.target.value}))}><option value="B2B">B2B</option><option value="B2CS">B2CS</option></select></div>
    </div>

    {/* ═══ PLACE OF SUPPLY INDICATOR ═══ */}
    <div style={{padding:'8px 14px',background:posBg,borderRadius:8,border:`1.5px solid ${posColor}22`,marginBottom:14,display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
      <span style={{fontSize:12.5,fontWeight:700,color:posColor}}>{posLabel}</span>
      {posValid&&<span style={{marginLeft:'auto',fontSize:11,color:posColor,opacity:.7}}>
        {isIGST?'IGST @':'CGST + SGST @'} {f.items[0]?.gstRate||3}% {!isIGST?`(${(f.items[0]?.gstRate||3)/2}% + ${(f.items[0]?.gstRate||3)/2}%)`:''}
      </span>}
    </div>

    {/* Customer */}
    <div style={{padding:14,background:'#faf8f4',borderRadius:10,border:'1px solid #e8e0d0',marginBottom:16}}>
      <h4 style={{margin:'0 0 10px',fontSize:13,fontWeight:700,color:'#5a5040'}}>Customer Details</h4>
      <div className="form-grid-2" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
        <div><label style={S.lbl}>Customer Name *</label>
          <select style={S.inp} value={f.customerName} onChange={e=>{const c=customers.find(x=>x.name===e.target.value);if(c)selectCust(c);else set(p=>({...p,customerName:e.target.value}));}}>
            <option value="">Select or type...</option>{customers.map(c=><option key={c.id} value={c.name}>{c.name} {c.city?'('+c.city+')':''}</option>)}
          </select>
        </div>
        <div><label style={S.lbl}>GSTIN <span style={{fontWeight:400,color:'#8a7e6b'}}>(auto-fills state)</span></label><input style={{...S.inp,textTransform:'uppercase',fontFamily:'monospace'}} value={f.customerGstin} maxLength={15} onChange={e=>handleGstin(e.target.value)}/></div>
        <div><label style={S.lbl}>Address</label><input style={S.inp} value={f.customerAddress} onChange={e=>set(p=>({...p,customerAddress:e.target.value}))}/></div>
        <div><label style={S.lbl}>Phone</label><input style={S.inp} value={f.customerPhone} onChange={e=>set(p=>({...p,customerPhone:e.target.value}))}/></div>
        <div><label style={{...S.lbl,color:!f.customerStateCode?'#c0392b':'#5a5040'}}>State (Place of Supply) *</label><select style={{...S.inp,borderColor:!f.customerStateCode?'#c0392b':'#ddd5c5'}} value={f.customerState} onChange={e=>{const v=e.target.value;const s=STATES.find(x=>x.n===v);set(p=>({...p,customerState:v,customerStateCode:s?.c||''}));}}><option value="">— Select State —</option>{STATES.map(s=><option key={s.c} value={s.n}>{s.n} ({s.c})</option>)}</select></div>
        <div><label style={S.lbl}>State Code</label><input readOnly style={{...S.inp,background:f.customerStateCode?'#f0ead8':'#fdeaea',fontFamily:'monospace',fontWeight:700}} value={f.customerStateCode||'Required'}/></div>
      </div>
      {!posCompanyCode&&<div style={{marginTop:8,padding:'6px 10px',background:'#fdeaea',borderRadius:6,fontSize:12,color:'#c0392b'}}>⚠ Your company state is not set. Go to Settings → Company Profile → set State first.</div>}
    </div>

    {/* Line Items — Jewellery */}
    <div style={{marginBottom:16}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
        <h4 style={{margin:0,fontSize:13,fontWeight:700,color:'#5a5040'}}>Line Items — Jewellery</h4>
        <button style={{...S.btnS,...S.btnSm}} onClick={addItem}><Ic name="plus" size={13}/> Add Item</button>
      </div>
      {f.items.map((it,i)=>{const c=calcItem(it);return <div key={i} style={{padding:10,background:'#faf8f4',borderRadius:8,border:'1px solid #e8e0d0',marginBottom:6}}>
        <div className="item-grid-6" style={{display:'grid',gridTemplateColumns:'2fr 1fr 1fr 1fr 1fr 1fr',gap:6,alignItems:'end'}}>
          <div><label style={{...S.lbl,fontSize:10.5}}>Item</label><select style={{...S.inp,fontSize:12.5}} value={it.productName} onChange={e=>updItem(i,'productName',e.target.value)}><option value="">Select...</option>{products.map(p=><option key={p.id} value={p.name}>{p.name}</option>)}</select></div>
          <div><label style={{...S.lbl,fontSize:10.5}}>HSN</label><input style={{...S.inp,fontSize:12.5}} value={it.hsn||''} onChange={e=>updItem(i,'hsn',e.target.value)}/></div>
          <div><label style={{...S.lbl,fontSize:10.5}}>Pcs</label><input style={{...S.inp,fontSize:12.5}} type="number" min="1" value={it.pcs} onChange={e=>updItem(i,'pcs',+e.target.value)}/></div>
          <div><label style={{...S.lbl,fontSize:10.5}}>Gross Wt (gm)</label><input style={{...S.inp,fontSize:12.5}} type="number" step="0.001" value={it.grossWt} onChange={e=>updItem(i,'grossWt',+e.target.value)}/></div>
          <div><label style={{...S.lbl,fontSize:10.5}}>Net Wt (gm)</label><input style={{...S.inp,fontSize:12.5}} type="number" step="0.001" value={it.netWt} onChange={e=>updItem(i,'netWt',+e.target.value)}/></div>
          <div><label style={{...S.lbl,fontSize:10.5}}>Purity</label><select style={{...S.inp,fontSize:12.5}} value={it.purity} onChange={e=>updItem(i,'purity',e.target.value)}>{PURITIES.map(p=><option key={p.v} value={p.v}>{p.l}</option>)}</select></div>
        </div>
        <div className="item-grid-inner" style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr 1fr 1fr auto',gap:6,marginTop:6,alignItems:'end'}}>
          <div><label style={{...S.lbl,fontSize:10.5}}>Rate/gm (₹)</label><input style={{...S.inp,fontSize:12.5}} type="number" value={it.ratePerGm} onChange={e=>updItem(i,'ratePerGm',+e.target.value)}/></div>
          <div><label style={{...S.lbl,fontSize:10.5}}>Making Type</label><select style={{...S.inp,fontSize:12.5}} value={it.makingType} onChange={e=>updItem(i,'makingType',e.target.value)}>{MAKING_TYPES.map(m=><option key={m.v} value={m.v}>{m.l}</option>)}</select></div>
          <div><label style={{...S.lbl,fontSize:10.5}}>Making (₹)</label><input style={{...S.inp,fontSize:12.5}} type="number" value={it.makingCharge} onChange={e=>updItem(i,'makingCharge',+e.target.value)}/></div>
          <div><label style={{...S.lbl,fontSize:10.5}}>Stone/Other (₹)</label><input style={{...S.inp,fontSize:12.5}} type="number" value={it.stoneCharges} onChange={e=>updItem(i,'stoneCharges',+e.target.value)}/></div>
          <div><label style={{...S.lbl,fontSize:10.5}}>GST%</label><select style={{...S.inp,fontSize:12.5}} value={it.gstRate} onChange={e=>updItem(i,'gstRate',+e.target.value)}>{GST_RATES.map(r=><option key={r} value={r}>{r}%</option>)}</select></div>
          {f.items.length>1&&<button style={{background:'none',border:'none',cursor:'pointer',color:'#c0392b',padding:4}} onClick={()=>remItem(i)}><Ic name="x" size={15}/></button>}
        </div>
        <div style={{marginTop:4,fontSize:11.5,color:'#6b6358',display:'flex',gap:16}}>
          <span>Metal: {fC(c.metalVal)}</span><span>Making: {fC(c.makingVal)}</span><span>Taxable: <strong>{fC(c.taxable)}</strong></span><span>GST: {fC(c.gst)}</span><span style={{fontWeight:700,color:'#3a2e1a'}}>Total: {fC(c.total)}</span>
        </div>
      </div>;})}
    </div>

    {/* Totals */}
    <div style={{padding:14,background:'#3a2e1a',borderRadius:10,color:'#e8d5a3',marginBottom:16}}>
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8,padding:'6px 10px',background:isIGST?'rgba(26,86,219,.15)':'rgba(22,101,52,.15)',borderRadius:6,fontSize:12}}>
        <span style={{fontWeight:700}}>{isIGST?'↔ INTER-STATE SUPPLY — IGST':'✓ INTRA-STATE SUPPLY — CGST + SGST'}</span>
        <span style={{marginLeft:'auto',fontSize:10.5,opacity:.7}}>POS: {posCustCode||'—'} | Supply: {posCompanyCode||'—'}</span>
      </div>
      <div style={{display:'flex',justifyContent:'space-between',padding:'3px 0',fontSize:13}}><span>Taxable Amount</span><span style={{fontWeight:600,fontFamily:'monospace'}}>{fC(totals.tax)}</span></div>
      <div style={{display:'flex',justifyContent:'space-between',padding:'1px 0',fontSize:10,opacity:.5}}><span>Net Weight: {fW(totals.wt)}</span></div>
      {!isIGST&&<>
        <div style={{display:'flex',justifyContent:'space-between',padding:'3px 0',fontSize:13}}><span>CGST @ {(f.items[0]?.gstRate||3)/2}%</span><span style={{fontFamily:'monospace'}}>{fC(totals.cgst)}</span></div>
        <div style={{display:'flex',justifyContent:'space-between',padding:'3px 0',fontSize:13}}><span>SGST @ {(f.items[0]?.gstRate||3)/2}%</span><span style={{fontFamily:'monospace'}}>{fC(totals.sgst)}</span></div>
      </>}
      {isIGST&&<div style={{display:'flex',justifyContent:'space-between',padding:'3px 0',fontSize:13}}><span>IGST @ {f.items[0]?.gstRate||3}%</span><span style={{fontFamily:'monospace'}}>{fC(totals.igst)}</span></div>}
      <div style={{display:'flex',justifyContent:'space-between',padding:'7px 0 0',fontSize:17,fontWeight:800,borderTop:'1px solid rgba(255,255,255,.15)',marginTop:6}}><span>Grand Total</span><span>{fC(grand)}</span></div>
      <div style={{fontSize:11,opacity:.6,marginTop:3}}>{numWords(grand)}</div>
    </div>

    <div><label style={S.lbl}>Notes</label><textarea style={{...S.inp,minHeight:40}} value={f.notes||''} onChange={e=>set(p=>({...p,notes:e.target.value}))}/></div>
    <div style={{display:'flex',gap:10,justifyContent:'flex-end',marginTop:16}}>
      <button style={S.btnS} onClick={onClose}>Cancel</button>
      <button style={S.btnP} onClick={doSave}><Ic name="save" size={15}/> {data?.id?'Update':'Create'} Invoice</button>
    </div>
  </div>;
}

// ═══════════════════════════════════════
// DC FORM (Jobwork / Finishing)
// ═══════════════════════════════════════
function DCForm({data,onSave,onClose,customers,notify,settings,count}){
  const defItem={description:'',grossWt:0,netWt:0,purity:settings.defaultPurity||'916',pcs:0};
  const[f,set]=useState({dcNumber:'',date:td(),jobworkerName:'',jobworkerAddress:'',purpose:'Polishing',status:'Sent',items:[{...defItem}],notes:'',...data});

  const addItem=()=>set(p=>({...p,items:[...p.items,{...defItem}]}));
  const updItem=(i,k,v)=>set(p=>({...p,items:p.items.map((it,j)=>j===i?{...it,[k]:v}:it)}));
  const remItem=(i)=>set(p=>({...p,items:p.items.filter((_,j)=>j!==i)}));

  const totalWt=f.items.reduce((s,it)=>s+(it.netWt||0),0);

  return <div>
    <div className="form-grid-3" style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10,marginBottom:14}}>
      <div><label style={S.lbl}>DC #</label><input style={{...S.inp,fontFamily:'monospace'}} value={f.dcNumber} placeholder={'DC-'+String(count+1).padStart(4,'0')} onChange={e=>set(p=>({...p,dcNumber:e.target.value}))}/></div>
      <div><label style={S.lbl}>Date</label><input style={S.inp} type="date" value={f.date} onChange={e=>set(p=>({...p,date:e.target.value}))}/></div>
      <div><label style={S.lbl}>Due Date</label><input style={{...S.inp,background:'#fef9e7'}} type="date" value={f.dueDate||addDays(f.date,settings.dcLimit)} onChange={e=>set(p=>({...p,dueDate:e.target.value}))}/></div>
    </div>
    <div className="form-grid-2" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:14}}>
      <div><label style={S.lbl}>Jobworker *</label><select style={S.inp} value={f.jobworkerName} onChange={e=>{const c=customers.find(x=>x.name===e.target.value);set(p=>({...p,jobworkerName:e.target.value,jobworkerAddress:c?.address||''}));}}>
        <option value="">Select...</option>{customers.map(c=><option key={c.id} value={c.name}>{c.name}</option>)}
      </select></div>
      <div><label style={S.lbl}>Purpose</label><select style={S.inp} value={f.purpose} onChange={e=>set(p=>({...p,purpose:e.target.value}))}>{DC_PURPOSES.map(p=><option key={p}>{p}</option>)}</select></div>
      <div><label style={S.lbl}>Status</label><select style={S.inp} value={f.status} onChange={e=>set(p=>({...p,status:e.target.value}))}><option>Sent</option><option>Received Back</option></select></div>
    </div>

    <div style={{marginBottom:14}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
        <h4 style={{margin:0,fontSize:13,fontWeight:700,color:'#5a5040'}}>Items</h4>
        <button style={{...S.btnS,...S.btnSm}} onClick={addItem}><Ic name="plus" size={13}/> Add</button>
      </div>
      {f.items.map((it,i)=><div key={i} className="item-grid-6" style={{display:'grid',gridTemplateColumns:'2fr 1fr 1fr 1fr 1fr auto',gap:6,marginBottom:4,alignItems:'end',padding:8,background:'#faf8f4',borderRadius:8,border:'1px solid #e8e0d0'}}>
        <div><label style={{...S.lbl,fontSize:10.5}}>Description</label><input style={{...S.inp,fontSize:12.5}} placeholder="e.g. Gold Chains for polishing" value={it.description} onChange={e=>updItem(i,'description',e.target.value)}/></div>
        <div><label style={{...S.lbl,fontSize:10.5}}>Pcs</label><input style={{...S.inp,fontSize:12.5}} type="number" value={it.pcs} onChange={e=>updItem(i,'pcs',+e.target.value)}/></div>
        <div><label style={{...S.lbl,fontSize:10.5}}>Gross Wt</label><input style={{...S.inp,fontSize:12.5}} type="number" step="0.001" value={it.grossWt} onChange={e=>updItem(i,'grossWt',+e.target.value)}/></div>
        <div><label style={{...S.lbl,fontSize:10.5}}>Net Wt</label><input style={{...S.inp,fontSize:12.5}} type="number" step="0.001" value={it.netWt} onChange={e=>updItem(i,'netWt',+e.target.value)}/></div>
        <div><label style={{...S.lbl,fontSize:10.5}}>Purity</label><select style={{...S.inp,fontSize:12.5}} value={it.purity} onChange={e=>updItem(i,'purity',e.target.value)}>{PURITIES.map(p=><option key={p.v} value={p.v}>{p.v}</option>)}</select></div>
        {f.items.length>1&&<button style={{background:'none',border:'none',cursor:'pointer',color:'#c0392b'}} onClick={()=>remItem(i)}><Ic name="x" size={14}/></button>}
      </div>)}
      <div style={{fontSize:12,fontWeight:700,color:'#6b4f1d',marginTop:4}}>Total Net Weight: {fW(totalWt)}</div>
    </div>

    <div><label style={S.lbl}>Notes</label><textarea style={{...S.inp,minHeight:36}} value={f.notes||''} onChange={e=>set(p=>({...p,notes:e.target.value}))}/></div>
    <div style={{display:'flex',gap:10,justifyContent:'flex-end',marginTop:14}}>
      <button style={S.btnS} onClick={onClose}>Cancel</button>
      <button style={S.btnP} onClick={()=>{if(!f.jobworkerName){notify("Jobworker required","warning");return;}onSave({...f,totalWeight:totalWt});}}><Ic name="save" size={15}/> Save DC</button>
    </div>
  </div>;
}

// ═══════════════════════════════════════
// LINE OF SALE FORM
// ═══════════════════════════════════════
function LOSForm({data,onSave,onClose,customers,products,notify,settings,count}){
  const defItem={productName:'',hsn:'7113',pcs:0,grossWt:0,netWt:0,purity:settings.defaultPurity||'916',ratePerGm:0,makingType:'per_gm',makingCharge:0,stoneCharges:0,gstRate:settings.defaultGst||3};
  const[f,set]=useState({losNumber:'',date:td(),retailerName:'',retailerGstin:'',retailerAddress:'',retailerState:'',retailerStateCode:'',retailerPhone:'',city:'',status:'On Approval',items:[{...defItem}],notes:'',...data});

  const addItem=()=>set(p=>({...p,items:[...p.items,{...defItem}]}));
  const updItem=(i,k,v)=>set(p=>({...p,items:p.items.map((it,j)=>{
    if(j!==i)return it;
    const updated={...it,[k]:v};
    if(k==='productName'){const prod=products.find(x=>x.name===v);if(prod){updated.hsn=prod.hsn||'7113';updated.purity=prod.defaultPurity||settings.defaultPurity;updated.makingType=prod.makingType||'per_gm';updated.makingCharge=prod.makingCharge||0;updated.gstRate=prod.defaultGst||3;}}
    return updated;
  })}));
  const remItem=(i)=>set(p=>({...p,items:p.items.filter((_,j)=>j!==i)}));

  const totalWt=f.items.reduce((s,it)=>s+(it.netWt||0),0);
  const totalVal=f.items.reduce((s,it)=>{const mv=(it.netWt||0)*(it.ratePerGm||0);const mk=it.makingType==='per_gm'?(it.makingCharge||0)*(it.netWt||0):it.makingType==='per_pc'?(it.makingCharge||0)*(it.pcs||1):(it.makingCharge||0);return s+mv+mk+(it.stoneCharges||0);},0);

  return <div>
    <div className="form-grid-3" style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10,marginBottom:14}}>
      <div><label style={S.lbl}>LOS #</label><input style={{...S.inp,fontFamily:'monospace'}} value={f.losNumber} placeholder={'LOS-'+String(count+1).padStart(4,'0')} onChange={e=>set(p=>({...p,losNumber:e.target.value}))}/></div>
      <div><label style={S.lbl}>Date</label><input style={S.inp} type="date" value={f.date} onChange={e=>set(p=>({...p,date:e.target.value}))}/></div>
      <div><label style={S.lbl}>City</label><input style={S.inp} value={f.city} placeholder="Destination city" onChange={e=>set(p=>({...p,city:e.target.value}))}/></div>
    </div>
    <div className="form-grid-2" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:14}}>
      <div><label style={S.lbl}>Retailer *</label><select style={S.inp} value={f.retailerName} onChange={e=>{const c=customers.find(x=>x.name===e.target.value);if(c)set(p=>({...p,retailerName:c.name,retailerGstin:c.gstin||'',retailerAddress:c.address||'',retailerState:c.state||'',retailerStateCode:c.stateCode||'',retailerPhone:c.phone||'',city:c.city||p.city}));else set(p=>({...p,retailerName:e.target.value}));}}>
        <option value="">Select...</option>{customers.map(c=><option key={c.id} value={c.name}>{c.name} {c.city?'('+c.city+')':''}</option>)}
      </select></div>
      <div><label style={S.lbl}>Phone</label><input style={S.inp} value={f.retailerPhone} onChange={e=>set(p=>({...p,retailerPhone:e.target.value}))}/></div>
      <div><label style={S.lbl}>Status</label><select style={S.inp} value={f.status} onChange={e=>set(p=>({...p,status:e.target.value}))}><option>On Approval</option><option>Sold</option><option>Returned</option></select></div>
    </div>

    {/* Items — same as invoice */}
    <div style={{marginBottom:14}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
        <h4 style={{margin:0,fontSize:13,fontWeight:700,color:'#5a5040'}}>Finished Jewellery Items</h4>
        <button style={{...S.btnS,...S.btnSm}} onClick={addItem}><Ic name="plus" size={13}/> Add</button>
      </div>

// DOCUMENT VIEW + PRINT

function DocView({type,data,company,logo}){
  const doPrint=()=>{
    let html='';
    if(type==='invoice')html=buildInvPrint(data,company,logo);
    else if(type==='dc')html=buildDCPrint(data,company,logo);
    else if(type==='los')html=buildLOSPrint(data,company,logo);
    else if(type==='receipt')html=buildRecPayPrint(data,company,logo,'RECEIPT VOUCHER','receivedFrom','Received From');
    else if(type==='payment')html=buildRecPayPrint(data,company,logo,'PAYMENT VOUCHER','paidTo','Paid To');
    else if(type==='expense')html=buildExpPrint(data,company,logo);
    printDoc(html);
  };

  return <div>
    <div style={{display:'flex',justifyContent:'flex-end',gap:8,marginBottom:14}}>
      <button style={S.btnP} onClick={doPrint}><Ic name="print" size={15}/> Print / Save as PDF</button>

    </div>
    {/* Quick inline preview */}
    <div style={{...S.card,padding:20}}>
      {type==='invoice'&&<InvPreview inv={data} company={company} logo={logo}/>}
      {type==='dc'&&<DCPreview dc={data} company={company}/>}
      {type==='los'&&<LOSPreview los={data} company={company}/>}
      {type==='receipt'&&<RecPayPreview data={data} type="receipt" company={company}/>}
      {type==='payment'&&<RecPayPreview data={data} type="payment" company={company}/>}
      {type==='expense'&&<ExpPreview data={data} company={company}/>}
    </div>
  </div>;
}

// Print builders
function buildInvPrint(inv,company,logo){
  const isIGST=inv.isIGST||(inv.customerStateCode&&company.stateCode&&String(inv.customerStateCode).trim()!==String(company.stateCode).trim());
  let itemsHTML='';
  (inv.items||[]).forEach((it,i)=>{
    const mv=(it.netWt||0)*(it.ratePerGm||0);const mk=it.makingType==='per_gm'?(it.makingCharge||0)*(it.netWt||0):it.makingType==='per_pc'?(it.makingCharge||0)*(it.pcs||1):(it.makingCharge||0);const tx=mv+mk+(it.stoneCharges||0);const gst=tx*(it.gstRate||3)/100;
    itemsHTML+=`<tr><td style="padding:6px 4px;border-bottom:1px solid #eee;font-size:12px">${i+1}</td><td style="padding:6px 4px;border-bottom:1px solid #eee;font-weight:600;font-size:12px">${it.productName}<br/><span style="font-size:10px;color:#888">HSN:${it.hsn} | ${it.purity}</span></td><td style="padding:6px 4px;border-bottom:1px solid #eee;text-align:right;font-size:12px">${it.pcs}</td><td style="padding:6px 4px;border-bottom:1px solid #eee;text-align:right;font-size:12px">${(it.netWt||0).toFixed(3)}</td><td style="padding:6px 4px;border-bottom:1px solid #eee;text-align:right;font-size:12px">${fC(it.ratePerGm)}</td><td style="padding:6px 4px;border-bottom:1px solid #eee;text-align:right;font-size:12px">${fC(mv)}</td><td style="padding:6px 4px;border-bottom:1px solid #eee;text-align:right;font-size:12px">${fC(mk)}</td><td style="padding:6px 4px;border-bottom:1px solid #eee;text-align:right;font-size:12px">${fC(it.stoneCharges||0)}</td><td style="padding:6px 4px;border-bottom:1px solid #eee;text-align:right;font-weight:600;font-size:12px">${fC(tx)}</td><td style="padding:6px 4px;border-bottom:1px solid #eee;text-align:right;font-size:12px">${it.gstRate}%</td><td style="padding:6px 4px;border-bottom:1px solid #eee;text-align:right;font-weight:700;font-size:12px">${fC(tx+gst)}</td></tr>`;
  });

  const posLine=isIGST?'Inter-State Supply | Place of Supply: '+inv.customerState+' ('+inv.customerStateCode+')':'Intra-State Supply | Place of Supply: '+(company.state||'')+' ('+(company.stateCode||'')+')';

  return `<div style="max-width:780px;margin:0 auto;background:#fff">
    ${buildPrintHeader(company,'TAX INVOICE',inv.invoiceNumber,fD(inv.invoiceDate),logo)}
    <div style="padding:4px 30px;background:${isIGST?'#eff6ff':'#ecfdf5'};font-size:10.5px;color:${isIGST?'#1a56db':'#166534'};font-weight:600;letter-spacing:.3px">${posLine}</div>
    <div style="padding:16px 30px;border-bottom:1px solid #eee">
      <div style="font-size:10px;font-weight:700;color:#6b4f1d;letter-spacing:1px;margin-bottom:4px">BILL TO</div>
      <div style="font-size:14px;font-weight:700">${inv.customerName}</div>
      <div style="font-size:11.5px;color:#555">${inv.customerAddress||''} | ${inv.customerState||''} (${inv.customerStateCode||''})</div>
      ${inv.customerGstin?'<div style="font-family:monospace;font-size:10.5px;color:#888;margin-top:2px">GSTIN: '+inv.customerGstin+'</div>':''}
    </div>
    <div style="padding:0 30px">
      <table style="width:100%;border-collapse:collapse"><thead><tr>
        ${['#','Item','Pcs','Net Wt(gm)','Rate/gm','Metal','Making','Stone','Taxable','GST%','Total'].map(h=>`<th style="padding:8px 4px;text-align:${['#','Item'].includes(h)?'left':'right'};font-size:9.5px;font-weight:700;color:#888;border-bottom:2px solid #3a2e1a;letter-spacing:.3px">${h}</th>`).join('')}
      </tr></thead><tbody>${itemsHTML}</tbody></table>
    </div>
    <div style="display:flex;justify-content:space-between;padding:14px 30px;gap:20">
      <div style="font-size:11px;color:#555;font-style:italic;flex:1;padding-top:4px">${numWords(inv.grandTotal)}</div>
      <table style="width:240px"><tbody>
        <tr><td style="padding:4px 0;font-size:12px">Taxable</td><td style="text-align:right;font-family:monospace;font-size:12px">${fC(inv.taxableAmount)}</td></tr>
        ${taxHTML}
        <tr><td style="padding:8px 0 0;font-size:14px;font-weight:700;border-top:2px solid #3a2e1a">Grand Total</td><td style="text-align:right;font-family:monospace;font-size:14px;font-weight:700;padding-top:8px;border-top:2px solid #3a2e1a;color:#6b4f1d">${fC(inv.grandTotal)}</td></tr>
      </tbody></table>
    </div>
    ${inv.notes?'<div style="padding:8px 30px;font-size:11px;color:#555"><strong>Notes:</strong> '+inv.notes+'</div>':''}
    ${buildPrintFooter(company)}
  </div>`;
}

// SALES REGISTER
// ═══════════════════════════════════════
function SalesRegister({invoices,company,logo}){
  const[dateFrom,setDF]=useState('');const[dateTo,setDT]=useState('');const[custFilter,setCF]=useState('');
  
  // Flatten all invoice items into rows
  const allItems=[];
  invoices.forEach(inv=>{
    (inv.items||[]).forEach(it=>{
      const mv=(it.netWt||0)*(it.ratePerGm||0);
      const mk=it.makingType==='per_gm'?(it.makingCharge||0)*(it.netWt||0):it.makingType==='per_pc'?(it.makingCharge||0)*(it.pcs||1):(it.makingCharge||0);
      const tx=mv+mk+(it.stoneCharges||0);const gst=tx*(it.gstRate||3)/100;
      allItems.push({invNo:inv.invoiceNumber,invDate:inv.invoiceDate,customer:inv.customerName,gstin:inv.customerGstin||'',item:it.productName,hsn:it.hsn,pcs:it.pcs||1,netWt:it.netWt||0,purity:it.purity,ratePerGm:it.ratePerGm||0,metalVal:mv,making:mk,stone:it.stoneCharges||0,taxable:tx,gstRate:it.gstRate||3,gst,total:tx+gst});
    });
  });

  const filtered=allItems.filter(r=>{
    if(dateFrom&&r.invDate<dateFrom)return false;
    if(dateTo&&r.invDate>dateTo)return false;
    if(custFilter&&!r.customer.toLowerCase().includes(custFilter.toLowerCase()))return false;
    return true;
  });

  const totals=filtered.reduce((a,r)=>({wt:a.wt+r.netWt,tax:a.tax+r.taxable,gst:a.gst+r.gst,total:a.total+r.total}),{wt:0,tax:0,gst:0,total:0});

  const doPrint=()=>{
    let rows='';filtered.forEach((r,i)=>{rows+=`<tr><td style="padding:4px;border:1px solid #ddd;font-size:11px">${i+1}</td><td style="padding:4px;border:1px solid #ddd;font-size:11px">${r.invNo}</td><td style="padding:4px;border:1px solid #ddd;font-size:11px">${fD(r.invDate)}</td><td style="padding:4px;border:1px solid #ddd;font-size:11px">${r.customer}</td><td style="padding:4px;border:1px solid #ddd;font-size:11px">${r.item}</td><td style="padding:4px;border:1px solid #ddd;font-size:11px">${r.hsn}</td><td style="padding:4px;border:1px solid #ddd;font-size:11px;text-align:right">${r.pcs}</td><td style="padding:4px;border:1px solid #ddd;font-size:11px;text-align:right">${r.netWt.toFixed(3)}</td><td style="padding:4px;border:1px solid #ddd;font-size:11px">${r.purity}</td><td style="padding:4px;border:1px solid #ddd;font-size:11px;text-align:right">${fC(r.taxable)}</td><td style="padding:4px;border:1px solid #ddd;font-size:11px;text-align:right">${fC(r.gst)}</td><td style="padding:4px;border:1px solid #ddd;font-size:11px;text-align:right;font-weight:700">${fC(r.total)}</td></tr>`;});
    printDoc(`<div style="max-width:900px;margin:0 auto">${buildPrintHeader(company,'SALES REGISTER','',dateFrom||dateTo?fD(dateFrom)+' to '+fD(dateTo):'All Dates',logo)}<div style="padding:10px 20px"><table style="width:100%;border-collapse:collapse"><thead><tr>${['#','Inv #','Date','Customer','Item','HSN','Pcs','Net Wt','Purity','Taxable','GST','Total'].map(h=>`<th style="padding:5px;border:1px solid #ddd;font-size:10px;font-weight:700;background:#faf8f4">${h}</th>`).join('')}</tr></thead><tbody>${rows}<tr style="font-weight:700;background:#faf8f4"><td colspan="7" style="padding:5px;border:1px solid #ddd;text-align:right;font-size:11px">TOTALS</td><td style="padding:5px;border:1px solid #ddd;text-align:right;font-size:11px">${totals.wt.toFixed(3)}</td><td style="padding:5px;border:1px solid #ddd"></td><td style="padding:5px;border:1px solid #ddd;text-align:right;font-size:11px">${fC(totals.tax)}</td><td style="padding:5px;border:1px solid #ddd;text-align:right;font-size:11px">${fC(totals.gst)}</td><td style="padding:5px;border:1px solid #ddd;text-align:right;font-size:11px">${fC(totals.total)}</td></tr></tbody></table></div></div>`);
  };

  return <div>
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14,flexWrap:'wrap',gap:8}}>
      <h2 style={{fontSize:20,fontWeight:800,margin:0,color:'#3a2e1a'}}>Sales Register <span style={{fontSize:13,fontWeight:400,color:'#a09880'}}>({filtered.length} items)</span></h2>
      <button style={S.btnP} onClick={doPrint}><Ic name="print" size={15}/> Print</button>
    </div>
    {/* Filters */}
    <div style={{display:'flex',gap:8,marginBottom:14,flexWrap:'wrap'}}>
      <div><label style={{...S.lbl,fontSize:11}}>From</label><input style={{...S.inp,width:140,fontSize:12.5}} type="date" value={dateFrom} onChange={e=>setDF(e.target.value)}/></div>
      <div><label style={{...S.lbl,fontSize:11}}>To</label><input style={{...S.inp,width:140,fontSize:12.5}} type="date" value={dateTo} onChange={e=>setDT(e.target.value)}/></div>
      <div><label style={{...S.lbl,fontSize:11}}>Customer</label><input style={{...S.inp,width:180,fontSize:12.5}} placeholder="Filter..." value={custFilter} onChange={e=>setCF(e.target.value)}/></div>
    </div>
    <div style={{...S.card,overflowX:'auto'}}>
      <table style={{width:'100%',borderCollapse:'collapse',minWidth:900}}>
        <thead><tr>{['#','Invoice','Date','Customer','Item','HSN','Pcs','Net Wt','Purity','Rate/gm','Taxable','GST','Total'].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead>
        <tbody>
          {filtered.map((r,i)=><tr key={i} className="row-hover">
            <td style={S.td}>{i+1}</td>
            <td style={{...S.td,fontFamily:'monospace',fontSize:12}}>{r.invNo}</td>
            <td style={S.td}>{fD(r.invDate)}</td>
            <td style={{...S.td,fontWeight:600}}>{r.customer}</td>
            <td style={{...S.td,fontWeight:600}}>{r.item}</td>
            <td style={{...S.td,fontFamily:'monospace',fontSize:12}}>{r.hsn}</td>
            <td style={{...S.td,textAlign:'right'}}>{r.pcs}</td>
            <td style={{...S.td,textAlign:'right'}}>{fW(r.netWt)}</td>
            <td style={S.td}>{r.purity}</td>
            <td style={{...S.td,textAlign:'right'}}>{fC(r.ratePerGm)}</td>
            <td style={{...S.td,textAlign:'right',fontWeight:600}}>{fC(r.taxable)}</td>
            <td style={{...S.td,textAlign:'right'}}>{fC(r.gst)}</td>
            <td style={{...S.td,textAlign:'right',fontWeight:700,color:'#6b4f1d'}}>{fC(r.total)}</td>
          </tr>)}
          {filtered.length>0&&<tr style={{background:'#faf8f4',fontWeight:700}}>
            <td colSpan={7} style={{...S.td,textAlign:'right'}}>TOTALS</td>
            <td style={{...S.td,textAlign:'right'}}>{fW(totals.wt)}</td>
            <td colSpan={2} style={S.td}></td>
            <td style={{...S.td,textAlign:'right'}}>{fC(totals.tax)}</td>
            <td style={{...S.td,textAlign:'right'}}>{fC(totals.gst)}</td>
            <td style={{...S.td,textAlign:'right',color:'#6b4f1d'}}>{fC(totals.total)}</td>
          </tr>}
          {!filtered.length&&<tr><td colSpan={13} style={{...S.td,textAlign:'center',color:'#a09880',padding:30}}>No records found</td></tr>}
        </tbody>
      </table>
    </div>
  </div>;
}

        <div><label style={S.lbl}>DC Limit (days)</label><input style={S.inp} type="number" min="1" value={settings.dcLimit} onChange={e=>setSettings(p=>({...p,dcLimit:+e.target.value}))}/></div>
        <div><label style={S.lbl}>Line of Sale Limit (days)</label><input style={S.inp} type="number" min="1" value={settings.losLimit} onChange={e=>setSettings(p=>({...p,losLimit:+e.target.value}))}/></div>
        <div><label style={S.lbl}>Default Purity</label><select style={S.inp} value={settings.defaultPurity} onChange={e=>setSettings(p=>({...p,defaultPurity:e.target.value}))}>{PURITIES.map(p=><option key={p.v} value={p.v}>{p.l}</option>)}</select></div>
        <div><label style={S.lbl}>Default GST %</label><select style={S.inp} value={settings.defaultGst} onChange={e=>setSettings(p=>({...p,defaultGst:+e.target.value}))}>{GST_RATES.map(r=><option key={r} value={r}>{r}%</option>)}</select></div>
      </div>
      <button style={{...S.btnP,marginTop:12}} onClick={()=>{LS.set('settings',settings);notify("Settings saved","success");}}><Ic name="save" size={15}/> Save Settings</button>
    </div>

    {/* e-Way Bill */}
    <div style={{...S.card,padding:20,marginBottom:14}}>
      <h3 style={{fontSize:14,fontWeight:700,margin:'0 0 12px'}}>🚛 e-Way Bill Portal</h3>
      <p style={{fontSize:13,color:'#6b6358',marginBottom:10}}>Generate e-Way Bill for goods transport (required when value exceeds ₹50,000 for gold/silver).</p>
      <button style={S.btnP} onClick={()=>window.open('https://ewaybillgst.gov.in','_blank')}><Ic name="globe" size={15}/> Open e-Way Bill Portal</button>
    </div>

    {/* Google Sheet */}
    <div style={{...S.card,padding:20}}>
      <h3 style={{fontSize:14,fontWeight:700,margin:'0 0 12px'}}>🔗 Google Sheet Two-Way Sync</h3>
      <div style={{marginBottom:10}}><label style={S.lbl}>Web App URL *</label><input style={S.inp} placeholder="https://script.google.com/macros/s/..." value={url} onChange={e=>setUrl(e.target.value)}/></div>
      <div style={{marginBottom:10}}><label style={S.lbl}>Spreadsheet ID *</label><input style={S.inp} placeholder="From your Google Sheet URL" value={sid} onChange={e=>setSid(e.target.value)}/><p style={{fontSize:11,color:'#8a7e6b',marginTop:2}}>docs.google.com/spreadsheets/d/<strong>THIS_PART</strong>/edit</p></div>
      <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:10}}>
        <button style={S.btnP} onClick={()=>{if(typeof connect==='function')connect();else{LS.set('url',url);LS.set('sid',sid);notify("Saved — reload to connect","success");}}}><Ic name="link" size={15}/> Connect & Setup</button>
        {conn&&<button style={S.btnS} onClick={()=>{if(typeof fullSync==='function')fullSync();}}><Ic name="sync" size={15}/> Pull from Sheet</button>}
        {conn&&<button style={S.btnS} onClick={()=>{if(typeof backup==='function')backup();}}><Ic name="cloud" size={15}/> Push All to Sheet</button>}
      </div>
      {conn&&<div style={{padding:'8px 12px',background:'#ecfdf5',borderRadius:6,display:'flex',alignItems:'center',gap:6,fontSize:12.5}}>
        <div style={{width:8,height:8,borderRadius:'50%',background:'#27ae60'}}/>
        <span style={{color:'#27ae60',fontWeight:600}}>Connected</span>
        {lastSync&&<span style={{color:'#8a7e6b',marginLeft:6}}>Last sync: {lastSync}</span>}
      </div>}
      {!conn&&<div style={{padding:12,background:'#faf8f4',borderRadius:8,fontSize:12,color:'#6b6358',lineHeight:1.6,border:'1px solid #e8e0d0',marginTop:6}}>
        <strong style={{color:'#3a2e1a'}}>Setup Steps:</strong><br/>
        1. Create a new Google Sheet<br/>
        2. Extensions → Apps Script → paste the backend code<br/>
        3. Deploy → New Deployment → Web App (Execute as: Me, Access: Anyone)<br/>
        4. Copy Web App URL + Sheet ID here<br/>
        5. Click "Connect & Setup" — all 9 sheets are auto-created!<br/>
        <br/>All data saves locally + syncs to Sheet on every save.
      </div>}
    </div>
  </div>;
}

// ═══════════════════════════════════════
// RENDER
// ═══════════════════════════════════════
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
